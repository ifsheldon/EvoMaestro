[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/evomaestro/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/evomaestro/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/evomaestro/supervisor.sock

[program:demo-backend]
command=/app/.venv/bin/python /app/docker/runtime.py backend
priority=10
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:demo-frontend]
command=/usr/local/bin/node /app/evomaestro-interface/server.js
environment=PORT="13000",HOSTNAME="0.0.0.0",API_PROXY="http://127.0.0.1:18001",EVOMAESTRO_PUBLIC_DEMO="1"
priority=20
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:demo-runner]
command=/app/.venv/bin/python /app/docker/runtime.py runner
priority=30
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:project-page]
command=/usr/local/bin/node /app/project-page/server.js
environment=PORT="13001",HOSTNAME="0.0.0.0"
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:shinka-mop]
command=/app/.venv/bin/python /app/docker/viewer.py /app/datasets/MOP/results_50g_runs --port 19870
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:shinka-graph-mop]
command=/app/.venv/bin/python /app/docker/viewer.py /app/datasets/GraphMOP/results_50g_runs --port 19871
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
