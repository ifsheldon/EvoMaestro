name: evomaestro

services:
  web:
    image: evomaestro-web:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${EVOMAESTRO_DEMO_PORT:-13000}:13000"
      - "127.0.0.1:${EVOMAESTRO_PROJECT_PORT:-13001}:13001"
      - "127.0.0.1:${EVOMAESTRO_MOP_PORT:-19870}:19870"
      - "127.0.0.1:${EVOMAESTRO_GRAPH_MOP_PORT:-19871}:19871"
    volumes:
      - mock-data:/data
    tmpfs:
      - /home/evomaestro:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
      - /run/evomaestro:uid=10001,gid=10001,mode=0700
      - /app/evomaestro-interface/.next/cache:uid=10001,gid=10001,mode=0755
      - /app/project-page/.next/cache:uid=10001,gid=10001,mode=0755
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mock-data:
